[project]
name = "songsync"
version = "0.1.0"
description = "Align a song's chord/lyric sheet to its audio and emit chords.json"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "demucs==4.0.1",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "numpy>=1.26,<2.2",
    "jsonschema>=4.23",
]

[project.scripts]
sync = "songsync.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/songsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs ML models on real audio"]
addopts = "-m 'not slow'"
